[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ktools-rna"
version = "0.1.0.dev0"
description = "KEA and K-RBP for RNA k-mer analysis"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.2,<3", "scipy>=1.11,<2",
  "statsmodels>=0.14,<1", "biopython>=1.81,<2",
  "matplotlib>=3.7,<4", "logomaker>=0.8,<1",
  "wordcloud>=1.9,<2", "matplotlib-venn>=0.11,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools]
py-modules = ["KEA"]

[tool.pytest.ini_options]
testpaths = ["tests"]

